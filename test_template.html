<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Compilers Project - Product Store</title>

  <style>
      /* ---------------------------------- */
      /* Basic Styles */
      /* ---------------------------------- */
      body {
        font-family: "Arial", sans-serif;
        margin: 0;
        background-color: #f4f4f4;
        color: #333;
        direction: rtl;
        text-align: right;
      }

      .container {
        width: 90%;
        max-width: 1200px;
        margin: 20px auto;
        padding: 20px;
        background: #fff;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }

      /* ---------------------------------- */
      /* Navigation Bar */
      /* ---------------------------------- */
      nav {
        background: #333;
        color: #fff;
        padding: 15px 0;
        text-align: center;
      }

      nav a {
        color: #fff;
        text-decoration: none;
        padding: 10px 20px;
        margin: 0 10px;
        border-radius: 5px;
        transition: background-color 0.3s;
      }

      nav a:hover {
        background: #555;
      }

      /* ---------------------------------- */
      /* Product List */
      /* ---------------------------------- */
      .product-list {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 20px;
        margin-top: 20px;
      }

      .product-card {
        background: #fff;
        border: 1px solid #ddd;
        padding: 15px;
        text-align: center;
        border-radius: 8px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
      }

      .product-card img {
        width: 100%;
        height: 200px;
        object-fit: cover;
        margin-bottom: 10px;
        border-radius: 4px;
      }

      .product-card h2 {
        font-size: 1.2em;
        margin: 10px 0;
      }

      .product-card a {
        display: inline-block;
        background: #007bff;
        color: #fff;
        padding: 8px 15px;
        text-decoration: none;
        border-radius: 4px;
        margin-top: 10px;
      }

      /* ---------------------------------- */
      /* Product Details */
      /* ---------------------------------- */
      .product-detail {
        text-align: center;
        padding: 30px;
      }

      .product-detail img {
        max-width: 400px;
        height: auto;
        margin-bottom: 20px;
        border: 1px solid #eee;
        padding: 5px;
      }

      .product-detail p {
        font-size: 1.1em;
        line-height: 1.6;
      }

      /* ---------------------------------- */
      /* Add Product Form */
      /* ---------------------------------- */
      .add-form label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
        margin-top: 15px;
      }

      .add-form input,
      .add-form textarea {
        width: 100%;
        padding: 10px;
        padding-right: 15px;
        margin-bottom: 15px;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
      }

      .add-form textarea {
        resize: none;
      }

      .add-form button {
        background: #28a745;
        color: #fff;
        border: none;
        padding: 10px 20px;
        cursor: pointer;
        border-radius: 4px;
        font-size: 1.1em;
      }

      .add-form button:hover {
        background: #218838;
      }

      /* ---------------------------------- */
      /* Remove Number Input Arrows */
      /* ---------------------------------- */
      .add-form input[type="number"]::-webkit-outer-spin-button,
      .add-form input[type="number"]::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }

      .add-form input[type="number"] {
        -moz-appearance: textfield;
      }

      /* ---------------------------------- */
      /* Delete Button */
      /* ---------------------------------- */
      .delete-button {
        background-color: #dc3545;
        color: #fff;
        padding: 10px 15px;
        border: none;
        cursor: pointer;
        border-radius: 4px;
        margin-top: 10px;
      }

      .delete-button:hover {
        background-color: #c82333;
      }
    </style>
</head>

<body>
<nav>
  <a href="{{ url_for('products_page') }}">Home</a>
  <a href="{{ url_for('add_product_page') }}">Add Product</a>
</nav>

<div class="container">{% block content %}{% endblock %}</div>
</body>
</html>
